<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch Pins · Your pins</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><div class="brand"><img src="icons/icon128.png" alt=""><div><h1>Twitch <span>Pins</span></h1><p>Pinned channels</p></div><span id="total" class="total">0/50</span></div></header>
<form id="add-form"><label for="channel">Pin a channel</label><div class="input-row"><input id="channel" type="text" placeholder="Twitch login or URL" autocomplete="off" spellcheck="false" required><button class="primary" id="add" type="submit">Pin</button></div></form>
<div class="section-title"><h2>Your list</h2><button id="refresh" class="quiet" type="button">↻ Refresh</button></div>
<div id="list"></div><div id="feedback" role="status" aria-live="polite"></div><div id="last-update"></div>
<footer><p>Use the pin on a channel page to pin or unpin it.</p></footer>
</main><script type="module" src="popup.js"></script></body></html>
